services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
      # a porta do frontend é publicada aqui, porque ele usa a rede do backend
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      # caminho do banco dentro do container (lido por endpoints/giovanni_almeida.py)
      DB_PATH: /workdir/database.db
    volumes:
      # persiste o SQLite fora do container
      - ./database.db:/workdir/database.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    # compartilha a rede do backend: o 127.0.0.1:8000 das páginas chega na API
    network_mode: "service:backend"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s