services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./database.db:/app/database.db
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/docs')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: .
    ports:
      - "8501:8501"
    environment:
      BASE_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
