services:
    frontend:
        build: .
        ports:
            - "8501:8501"
        environment:
            - BACKEND_URL=http://backend:8000
        depends_on:
            backend:
                condition: service_healthy
    backend:
        build: ./backend/
        ports:
            - "8000:8000"
        environment:
            - DB_PATH=/dados/database_backup.db
        volumes:
            - ./database_backup.db:/dados/database_backup.db
        healthcheck:
            test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')" ]
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 5s