services:

    backend:
        build:
            context: .
            dockerfile: backend/Dockerfile
        ports:
            - "8000:8000"
        volumes: 
            - ./database.db:/app/database.db

        
    frontend:
        build:
            context: .
            dockerfile: Dockerfile
        ports: 
            - "8501:8501"
        depends_on: 
            - backend
        environment:
            - API_URL=backend:8000