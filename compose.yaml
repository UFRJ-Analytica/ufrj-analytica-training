services:

    backend:
        build: ./backend/
        ports:
            - 8000:8000
        expose:
            - 8000

    frontend:
        build: .
        ports:
            - 8501:8501
        expose:
            - 8501

    chromadb:
        image: chromadb/chroma
        ports:
            - "8001:8000"
        volumes:
            - chroma_data:/data

volumes:
    chroma_data: